<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Interface</title>
    <link rel="stylesheet" href="order_styles.css">
    <script src="https://kit.fontawesome.com/1fd114d0f4.js" crossorigin="anonymous"></script>
    <script src="order_script.js" defer></script>
</head>
<body>
    <div class="order-modal">
        <div class="order-header">
            <h2 class="order-title">Order <i class="fa-solid fa-cart-plus cart-icon"></i></h2>
        </div>
        <table class="order-table">
            <thead>
                <tr>
                    <th>Order #</th>
                    <th>Status</th>
                    <th>Date Ordered</th>
                    <th>Total</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="order-table-body">
                <!-- Orders will be dynamically inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Order Details Modal -->
    <div id="order-details-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="order-number">Order #</h2>
                <i class="fa-solid fa-cart-plus"></i>
            </div>
            <table class="details-table">
                <thead>
                    <tr>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="order-items-list">
                    <!-- Order items will be dynamically inserted here -->
                </tbody>
            </table>
            <div class="order-summary">
                <p><strong>Status:</strong> <span id="order-status" class="status-label"></span></p>
                <p><strong>Date ordered:</strong> <span id="order-date"></span></p>
                <p><strong>Total:</strong> <span id="order-total"></span></p>
            </div>
            <div class="modal-actions">
                <button id="return-btn" class="btn">Return</button>
                <button id="cancel-order-btn" class="btn btn-danger hidden">Cancel Order</button>
            </div>
        </div>
    </div>
</body>
</html>
