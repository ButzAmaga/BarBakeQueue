{% load static %}
<table class="table table-borderless">
    <thead>
        <tr>
          <th >Order id</th>
          <th >Customer</th>
          <th >Status</th>
          <th >Delivery date</th>
          <th >Total</th>
          <th >Actions</th>
        </tr>
    </thead>
    
    <tbody>
        {% for order in orders  %}
            <tr>
                <th scope="row" class="text-end align-middle">{{order.id}}</th>
                <td class="align-middle">
                    <div class="d-flex align-items-center gap-2">
                        <img src="{{order.customer.profile_pic.url}}" style="width: 2em; aspect-ratio: 1/1;" class="rounded-5">
                        <span>{{order.customer.first_name}}</span>
                    </div>
                </td>
                <td class="align-middle"><span style="font-size: .8em;" class="rounded rounded-5 bg-primary p-2 text-white">{{order.status}}</span></td>
                <td class="align-middle">{{order.delivery_date|date:'m/d/y'}}</td>
                <td class="text-end fw-bold align-middle">&#8369 {{order.total_price}}</td>
                <td class="align-middle">
                    <div>

                        <!-- order transaction -->
                        {% if order.is_have_transactions %}
                            <button
                                data-bs-target="#modal_out" data-bs-toggle="modal"
                                hx-target="#modal_out_content" hx-swap="innerHTML" 
                                hx-get="{% url 'transaction:order_transactions' order.id %}"
                                class="btn p-1" title="order transaction">
                                <img style="width: 1.25em; aspect-ratio: 1/1;" src="{% static 'images/icons/payment.png' %}" alt="">
                            </button>
                        
                        {% else %}
                            <button
                                class="btn p-1" title="order transaction (no transaction yet) ">
                                <img style="width: 1.25em; aspect-ratio: 1/1; filter: grayscale(100%);" src="{% static 'images/icons/payment.png' %}" alt="">
                            </button>
                        {% endif %}

                        <!-- order status -->
                        
                        <button
                            data-bs-target="#modal_out" data-bs-toggle="modal"
                            hx-target="#modal_out_content" hx-swap="innerHTML" 
                            hx-get="{% url 'order:status_change' order.id %}"
                            class="btn p-1" title="change status">
                            <img style="width: 1.25em; aspect-ratio: 1/1;" src="{% static 'images/icons/change status.png' %}" alt="">
                        </button>
                            

                        <!-- view order -->
                        <button class="btn p-1" title="order details">
                            <img style="width: 1.25em; aspect-ratio: 1/1;" src="{% static 'images/icons/eye.png' %}" alt="">
                        </button>

                    </div>
                </td>
            </tr>
        {% endfor %}
    </tbody>
        
</table>
