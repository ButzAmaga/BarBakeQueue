<form class="d-flex flex-column gap-2" hx-post="{% url 'order:cart_items_v2' %}" hx-swap="outerHTML" method="post">

    {% csrf_token %}
    

    {{form}}
    
    {% comment %}
        
    {{form.management_form}}
    {% for instance in form  %}

        <div class="d-flex gap-1">
            {{instance}}
        </div>

        
    {% endfor %}
    {% endcomment %}
            
        


        
    <button class="btn btn-primary" type="submit">Place Order</button>
</form>
